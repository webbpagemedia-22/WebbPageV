<title>The Neuro Spicy Cookbook</title>
<meta name="description" content="OG's family recipes, from Arroz de OG to the Sunday roast. Tap any step to watch how it's done.">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#1C3F94; --cobalt-deep:#132C6B; --saffron:#E9A21B; --saffron-soft:#FCEFD2;
  --olive:#5E6B2A; --plaster:#F7F7F4; --ink:#232836; --muted:#5B6170; --line:#DADCE3;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Lexend",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plaster);color:var(--ink);font:400 1.125rem/1.6 var(--body)}
a{color:var(--cobalt)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:4px}
.wrap{max-width:68rem;margin:0 auto;padding:0 1.25rem}

/* tile band: the cover's one statement */
.tiles{
  --t:56px;
  background-color:var(--cobalt);
  background-image:
    radial-gradient(circle at 50% 50%, var(--plaster) 0 18%, transparent 19%),
    radial-gradient(circle at 0 0, var(--plaster) 0 30%, transparent 31%),
    radial-gradient(circle at 100% 0, var(--plaster) 0 30%, transparent 31%),
    radial-gradient(circle at 0 100%, var(--plaster) 0 30%, transparent 31%),
    radial-gradient(circle at 100% 100%, var(--plaster) 0 30%, transparent 31%),
    radial-gradient(circle at 50% 50%, var(--saffron) 0 8%, transparent 9%);
  background-size:var(--t) var(--t);
  background-blend-mode:normal;
}
.cover-tiles{height:9rem}
.strip{height:14px}

.review{background:var(--saffron-soft);border-bottom:2px solid var(--saffron);font-size:.95rem}
.review p{margin:0;padding:.6rem 0}

/* cover */
.cover h1{font:800 clamp(3.2rem,11vw,7.5rem)/.92 var(--display);letter-spacing:-.03em;color:var(--cobalt);margin:2.5rem 0 1rem}
.cover .lede{max-width:34rem;font-size:1.25rem;color:var(--muted);margin:0 0 2.5rem}
.foreword{max-width:38rem;background:#fff;border-left:5px solid var(--saffron);padding:1.25rem 1.5rem;margin:0 0 3rem}
.foreword h2{font:700 1.5rem/1.2 var(--display);margin:0 0 .6rem;color:var(--cobalt)}
.foreword p{margin:0 0 .7rem}
.foreword .sign{font:700 1.2rem/1.2 var(--display);margin:0;color:var(--olive)}
.contents{display:grid;gap:2rem 3rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));padding-bottom:4rem}
.contents h2{font:700 1.35rem/1.2 var(--display);margin:0 0 .6rem;color:var(--olive)}
.contents ul{list-style:none;margin:0;padding:0}
.contents li a{display:block;padding:.55rem 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}
.contents li a:hover{color:var(--cobalt)}
.contents li small{display:block;font-weight:400;color:var(--muted);font-size:.9rem}

/* recipe */
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;font-size:.95rem}
.top a{text-decoration:none;font-weight:700}
.rhead{padding:1rem 0 1.5rem;border-bottom:1px solid var(--line)}
.rhead .cat{color:var(--olive);font-weight:700;margin:0}
.rhead h1{font:800 clamp(2.4rem,7vw,4.4rem)/1 var(--display);letter-spacing:-.02em;color:var(--cobalt);margin:.2rem 0 .3rem}
.rhead .aka{font-style:italic;color:var(--muted);margin:0 0 .6rem}
.rhead .blurb{max-width:40rem;margin:.4rem 0 1rem;font-size:1.2rem}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin:0}
.meta div{display:flex;gap:.4rem;align-items:baseline}
.meta dt{color:var(--muted);font-size:.95rem}
.meta dd{margin:0;font-weight:700}
.hero{display:block;width:100%;max-height:30rem;aspect-ratio:3/2;object-fit:cover;border-radius:10px;margin:1.5rem 0 0;background:var(--line)}
.intro{background:#fff;border-left:5px solid var(--olive);padding:1rem 1.25rem;margin:1.5rem 0 0;max-width:46rem}

.body{display:grid;gap:2.5rem;padding:2rem 0 3rem}
@media(min-width:900px){.body{grid-template-columns:19rem 1fr}.ingr{position:sticky;top:1rem;align-self:start}}
.ingr h2,.method h2{font:700 1.5rem/1.2 var(--display);margin:0 0 .8rem}
.ingr ul{list-style:none;margin:0;padding:0}
.ingr li{border-top:1px solid var(--line)}
.ingr label{display:flex;gap:.7rem;padding:.55rem 0;cursor:pointer;align-items:flex-start}
.ingr input{width:1.2rem;height:1.2rem;margin-top:.25rem;accent-color:var(--olive);flex:none}
.ingr input:checked + span{color:var(--muted);text-decoration:line-through}
.equip{margin-top:1rem;color:var(--muted);font-size:1rem}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{display:grid;grid-template-columns:3.6rem 1fr;gap:0 1rem;padding:1rem 0;border-top:1px solid var(--line)}
.num{
  width:3.4rem;height:3.4rem;border-radius:50%;border:3px solid var(--saffron);background:#fff;
  font:800 1.5rem/1 var(--display);color:var(--cobalt);cursor:pointer;position:relative;
  display:grid;place-items:center;transition:background .15s,color .15s;
}
.num:hover{background:var(--saffron-soft)}
.num[aria-expanded="true"]{background:var(--saffron);color:var(--cobalt-deep)}
.num .play{position:absolute;right:-4px;bottom:-4px;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--cobalt);display:grid;place-items:center}
.num .play::after{content:"";border-left:7px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.num[disabled]{border-color:var(--line);cursor:default}
.num[disabled] .play{display:none}
.stext p{margin:.35rem 0 .4rem}
.watch{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}
.watch button{background:none;border:1px solid var(--line);border-radius:999px;padding:.15rem .7rem;font-size:.9rem;color:var(--cobalt);cursor:pointer}
.watch button:hover,.watch button[aria-pressed="true"]{border-color:var(--cobalt);background:#fff}
.see{margin:.2rem 0 0;font-weight:600}
.check{background:var(--saffron-soft);border-left:4px solid var(--saffron);padding:.4rem .7rem;margin:.5rem 0 0;font-size:.95rem}
.player{grid-column:1/-1;margin-top:.9rem}
.player .frame{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
.player.short .frame{padding-top:0;height:min(70vh,640px);max-width:360px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player figcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem}
.tips{margin-top:2rem;padding:1.1rem 1.25rem;background:#fff;border-left:5px solid var(--cobalt)}
.tips h3{font:700 1.2rem/1.2 var(--display);margin:0 0 .4rem}
.tips ul{margin:0;padding-left:1.1rem}

.flip{display:flex;justify-content:space-between;gap:1rem;padding:1.5rem 0 3rem;border-top:1px solid var(--line)}
.flip a{text-decoration:none;max-width:48%}
.flip small{display:block;color:var(--muted)}
.flip strong{font:700 1.2rem/1.2 var(--display)}
.flip .next{text-align:right;margin-left:auto}
footer{font-size:.9rem;color:var(--muted);padding:1.5rem 0 2.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.num .play,.watch,.top,.flip,.review{display:none}}
</style>
</head>

<script>
const BOOK = {"title": "The Neuro Spicy Cookbook", "foreword": {"title": "Foreword", "paragraphs": ["This recipe book was written for my wife Rosy, who has for many Christmases and birthdays asked for something that could help her cook.", "This book will hopefully be of help, and the supporting website links are there for anyone who doesn't understand terms usually used in cookery books."], "sign": "OG"}, "recipes": [{"id": "arroz-de-og", "name": "Arroz de OG", "aka": "a.k.a. Arroz de Dave", "category": "Basics", "blurb": "The rice that goes with nearly everything in this book. No scales, no measuring jug, just your little finger.", "prep": "3–4 mins", "cook": "13–15 mins", "serves": "2", "ingredients": ["1 cup of white rice", "Cold water"], "steps": [{"text": "Add one cup of white rice to a small saucepan.", "tech": ["rinse-rice"]}, {"text": "Wash with cold water. Rinse it through at least 6 times, until the water runs clear.", "tech": ["rinse-rice"]}, {"text": "Add water up to the first crease on your little finger, with your fingertip resting on top of the rice.", "tech": ["finger-rice-water"]}, {"text": "Bring to the boil and put the lid on.", "tech": ["absorption-rice"]}, {"text": "Turn down to a simmer and cook for 11 mins. Check whether the water has gone, and keep it on the heat until it has.", "tech": ["absorption-rice"]}, {"text": "When you can see little air holes in the rice, put the lid back on, give it 1 min on the lowest heat, then turn the heat off.", "tech": ["absorption-rice"]}, {"text": "Leave the lid on for another 2 mins before serving.", "tech": ["rest-rice"]}], "tips": ["The air holes on top of the rice tell you the water has gone."], "image": "images/arroz-de-og.jpg", "imageAlt": "A steaming bowl of fluffy white rice in a blue and white bowl"}, {"id": "pasta", "name": "Pasta the OG way", "category": "Basics", "blurb": "Any pasta, cooked so it still has a bit of bite. Read the packet, then knock a minute off.", "prep": "1 min", "cook": "Depends on the pasta", "serves": "As many as you're feeding", "ingredients": ["Pasta, any shape", "Cold water", "Salt, plenty of it"], "equipment": ["Large pan"], "steps": [{"text": "Fill a large pan with cold water and salt it heavily.", "tech": ["boil-pasta"]}, {"text": "Bring to the boil on a medium heat, then add the pasta. Any pasta.", "tech": ["boil-pasta"]}, {"text": "Find the cooking time on the packet, take the lowest number and knock 1 minute off. Fusilli says 8–10 mins, so boil it for 7.", "tech": ["boil-pasta"]}, {"text": "Take the pasta out and let it rest for a minute.", "tech": ["boil-pasta"]}, {"text": "Serve with your sauce.", "tech": ["boil-pasta"]}], "tips": ["Save a cup of the pasta water to thicken your sauce.", "Forgot the timer and boiled it a bit too long? Take the pasta out and run cold water through it to stop it cooking. When you're ready, pour boiling water over it to heat it back up without cooking it any further."], "image": "images/pasta.jpg"}, {"id": "boiled-eggs", "name": "OG Boiled Eggs", "category": "Basics", "blurb": "Gloriously simple. Cold water, bring to the boil, three minutes.", "prep": "1 min", "cook": "6–13 mins", "serves": "1+", "ingredients": ["Eggs", "Cold water"], "steps": [{"text": "Put the eggs in a saucepan of cold water.", "tech": ["boil-eggs"]}, {"text": "Bring up to the boil. For a runny yolk, leave for 3 mins.", "tech": ["boil-eggs"]}, {"text": "For hard-boiled eggs, leave for 8 mins.", "tech": ["boil-eggs"]}], "tips": [], "image": "images/boiled-eggs.jpg", "imageAlt": "Three peeled boiled eggs in a blue and white bowl"}, {"id": "scrambled-eggs", "name": "OG Scrambled Eggs", "category": "Breakfast", "blurb": "Garlicky, peppery scrambled eggs. Lovely with Ajo y champiñones.", "prep": "2 mins", "cook": "3–5 mins", "serves": "1", "ingredients": ["3 eggs minimum", "Garlic (grated or granules)", "Black pepper", "Salt", "Toast, to serve"], "steps": [{"text": "Crack at least 3 eggs into a bowl and add some garlic and pepper.", "tech": ["crack-eggs"]}, {"text": "Whisk until thoroughly mixed.", "tech": ["whisk-eggs"]}, {"text": "Pour into a frying pan that's already hot, on a medium heat.", "tech": ["scramble-eggs"]}, {"text": "Add salt and keep stirring, turning the heat down as you go.", "tech": ["scramble-eggs"]}, {"text": "Cook through until they're as soft or firm as you like them.", "tech": ["scramble-eggs"]}], "tips": ["Serve with toast or Ajo y champiñones."], "image": "images/scrambled-eggs.jpg", "imageAlt": "Creamy scrambled eggs with black pepper on a slice of thick toast"}, {"id": "ajo-y-champinones", "name": "Ajo y champiñones", "category": "Breakfast", "blurb": "Garlic mushrooms cooked low and slow in loads of butter.", "prep": "5 mins", "cook": "10–15 mins", "serves": "2", "ingredients": ["Half a pack of mushrooms", "4 cloves of garlic, grated (powder or granules only if you're desperate)", "100–150g butter, cut into squares"], "steps": [{"text": "Trim half a pack of mushrooms.", "tech": ["clean-mushrooms"]}, {"text": "Grate 4 cloves of garlic.", "tech": ["grate-garlic"]}, {"text": "Cut 100–150g of butter into squares.", "tech": ["cube-butter"]}, {"text": "Put a few squares of butter and half the garlic into a small saucepan on the lowest heat.", "tech": ["garlic-butter"]}, {"text": "Cut the mushrooms into quarters, crossways.", "tech": ["quarter-mushrooms"]}, {"text": "Add the mushrooms and the rest of the butter and garlic, and stir slowly until the butter has melted and every mushroom is coated.", "tech": ["garlic-mushrooms"]}, {"text": "Leave to cook for 5–10 mins, adding more butter and garlic if it needs it.", "tech": ["garlic-mushrooms"]}], "tips": ["Add to a breakfast, or have on toast with eggs."], "image": "images/ajo-y-champinones.jpg", "imageAlt": "Garlic butter mushrooms with parsley in a terracotta dish, with crusty bread"}, {"id": "satay-sauce", "name": "OG Satay Sauce", "category": "Sauces", "blurb": "Five-minute peanut sauce for stir fries, or ten minutes for satay chicken.", "prep": "3 mins", "cook": "5–10 mins", "serves": "2–3", "ingredients": ["1 tin coconut milk", "3 tbsp peanut butter", "Garlic", "Kecap manis (sweet soy sauce)", "Curry powder", "Fish sauce", "MSG (optional)"], "steps": [{"text": "Put everything except the coconut milk into a bowl and mix into a paste.", "tech": ["satay-paste"]}, {"text": "Pour the coconut milk into a small saucepan.", "tech": ["satay-paste"]}, {"text": "Add the paste from the bowl and mix it into the coconut milk.", "tech": ["satay-paste"]}, {"text": "Heat slowly up to a simmer, then simmer for 5–10 mins until it's as thick as you want it.", "tech": ["reduce-sauce"]}], "tips": ["5 mins for a stir-fry sauce.", "10 mins for a satay chicken sauce.", "Add MSG to make it sing."], "image": "images/satay-sauce.jpg", "imageAlt": "Peanut satay sauce topped with chopped peanuts and spring onion in a blue and white bowl"}, {"id": "bechamel", "name": "OG Béchamel", "category": "Sauces", "blurb": "The white sauce for lasagne, and the start of a cheese sauce for anything else.", "prep": "2 mins", "cook": "10–15 mins", "serves": "Enough for 1 lasagne", "ingredients": ["50g butter", "50g plain flour", "600ml milk", "1 tsp English mustard", "Pinch of nutmeg", "Salt and pepper"], "steps": [{"text": "Melt the butter in a saucepan on a low to medium heat.", "tech": ["make-roux"]}, {"text": "Add the flour and stir for 1–2 mins into a smooth paste. Keep it pale; don't let it brown.", "tech": ["make-roux"]}, {"text": "Take off the heat and add a splash of the milk, whisking until it's smooth.", "tech": ["bechamel-milk"]}, {"text": "Keep adding the milk a bit at a time, whisking out any lumps before the next splash goes in.", "tech": ["bechamel-milk"]}, {"text": "Put back on a medium heat and keep stirring for 5–8 mins until it thickens and coats the back of a spoon.", "tech": ["bechamel-milk"]}, {"text": "Season with salt, pepper, a pinch of nutmeg and the teaspoon of English mustard, and stir it through.", "tech": ["season"]}], "tips": ["Lumpy? Take it off the heat and give it a hard whisk.", "For a cheese sauce, stir in a handful of grated mature cheddar off the heat."], "image": "images/bechamel.jpg", "imageAlt": "Smooth béchamel sauce being whisked in a steel saucepan, with butter and nutmeg beside it"}, {"id": "nasi-goreng", "name": "Nasi Goreng", "category": "Rice & Curries", "blurb": "It means fried rice. The best thing that can happen to yesterday's Arroz de OG.", "prep": "10 mins", "cook": "10 mins", "serves": "2", "ingredients": ["A portion of Arroz de OG", "1 onion or 4 shallots, chopped", "1 pointed or red pepper, cut into thin strips", "Chicken, thinly sliced", "Prawns", "Kecap manis (sweet soy sauce)", "Shrimp paste or fish sauce", "MSG, a sprinkle", "Spring onion, to garnish", "1 egg per person"], "equipment": ["Wok or wide frying pan"], "steps": [{"text": "Chop the onion or shallots.", "tech": ["chop-onion"]}, {"text": "Cut the pepper into thin strips.", "tech": ["slice-pepper"]}, {"text": "Slice the chicken thinly.", "tech": ["slice-chicken"]}, {"text": "Fry the onion or shallots in the wok for 1 min.", "tech": ["stir-fry"]}, {"text": "Add the pepper and cook for 1 min.", "tech": ["stir-fry"]}, {"text": "Add the chicken and cook it through until it's white, then add 1 tbsp kecap manis and 1 tbsp shrimp paste (fish sauce works instead).", "tech": ["stir-fry"]}, {"text": "Add the prawns and stir through until they turn pink.", "tech": ["cook-prawns"]}, {"text": "Add the Arroz de OG and stir it through.", "tech": ["fried-rice"]}, {"text": "Add 2 tbsp kecap manis and keep it moving for 3 mins so the rice doesn't stick. Good chance to toss the rice!", "tech": ["wok-toss"]}, {"text": "Add a sprinkle of MSG to get that umami flavour.", "tech": ["season"]}, {"text": "Add the spring onion for garnish.", "tech": ["slice-spring-onion"]}, {"text": "Fry an egg (in the wok, if you're using one), put it on top and serve.", "tech": ["fry-egg"]}], "tips": ["Cold, day-old rice fries best."], "image": "images/nasi-goreng.jpg", "imageAlt": "Nasi goreng with chicken, a crispy fried egg, cucumber and prawn crackers in a blue and white bowl"}, {"id": "og-curry", "name": "OG Curry", "category": "Rice & Curries", "blurb": "A creamy family curry. Mild for the little one or hot with lots of chilli, it works both ways.", "prep": "10 mins", "cook": "30 mins", "serves": "3–4", "ingredients": ["Pancetta", "Onions", "Garlic", "Chicken breast or thigh fillets", "50ml cream or Elmlea", "250ml chicken stock", "Tomato purée (or 250ml passata)", "Curry powder", "Cumin", "Turmeric", "Asafoetida", "Garam masala", "Chilli, to taste"], "steps": [{"text": "Fry the pancetta on a low heat.", "tech": ["fry-pancetta"]}, {"text": "Add the onions and garlic and soften them until the onions go translucent.", "tech": ["soften-onion"]}, {"text": "Chop the chicken into chunks and fry.", "tech": ["dice-chicken", "seal-chicken"]}, {"text": "Take off the heat and add the tomato purée and all the spices except the garam masala.", "tech": ["bloom-spices"]}, {"text": "Coat the chicken, then add 250ml chicken stock.", "tech": ["make-stock"]}, {"text": "Add 50ml of cream or Elmlea.", "tech": ["cream-curry"]}, {"text": "Mix and put back on a medium heat.", "tech": ["simmer"]}, {"text": "Simmer for 20 mins until the chicken's cooked through and the sauce has thickened.", "tech": ["simmer"]}, {"text": "Stir in the garam masala at the end and taste for salt and chilli.", "tech": ["garam-masala"]}], "tips": ["Goes with naans, chapatis or Arroz de OG."], "image": "images/og-curry.jpg", "imageAlt": "Chicken curry in a creamy orange sauce with white rice and coriander"}, {"id": "thai-curry", "name": "Thai Curry", "category": "Rice & Curries", "blurb": "Red or green, whichever paste is in the cupboard.", "prep": "10 mins", "cook": "25 mins", "serves": "3–4", "ingredients": ["Onions", "Garlic", "Chicken breast or thigh fillets", "400ml coconut milk", "100ml chicken stock", "2 tbsp Thai red or green curry paste", "Tin of bamboo shoots", "Chilli, to taste"], "steps": [{"text": "Fry the onions on a medium heat and soften them until they go translucent.", "tech": ["soften-onion"]}, {"text": "Cut the chicken into thin slices and fry.", "tech": ["slice-chicken", "seal-chicken"]}, {"text": "Add the garlic and stir it through for a minute.", "tech": ["chop-garlic"]}, {"text": "Add the red or green curry paste.", "tech": ["fry-curry-paste"]}, {"text": "Coat the chicken, then add the chicken stock and the coconut milk.", "tech": ["thai-curry"]}, {"text": "Drain the bamboo shoots and add them.", "tech": ["drain-tin"]}, {"text": "Mix, bring to a simmer and cook for 20 mins.", "tech": ["simmer"]}], "tips": ["Goes well with Arroz de OG."], "image": "images/thai-curry.jpg", "imageAlt": "Thai green chicken curry with bamboo shoots, red pepper, basil and lime, with rice on the side"}, {"id": "arroz-con-chorizo", "name": "Arroz con chorizo, pimiento y pollo", "category": "Rice & Curries", "blurb": "OG's paella-style rice: chorizo, peppers and chicken, cooked slowly until the rice starts to pop.", "prep": "15 mins", "cook": "30–60 mins", "serves": "3–4", "ingredients": ["Chorizo", "Chicken breast or thigh fillets", "1 large onion", "Garlic", "2 red peppers", "1 litre chicken stock", "Valenciana paella seasoning sachet", "1 cup paella rice"], "steps": [{"text": "Fry the chorizo on a low heat to let the oil out of it.", "tech": ["fry-chorizo"]}, {"text": "Add the onion and garlic and soften them until the onion goes translucent.", "tech": ["soften-onion"]}, {"text": "Add the chicken and fry on a medium heat until it's white on all sides.", "tech": ["seal-chicken"]}, {"text": "Add the peppers and fry them lightly.", "tech": ["slice-pepper"]}, {"text": "Take off the heat, add the Valenciana sachet and coat everything in the pan, then add a cup of paella rice.", "tech": ["paella-rice"]}, {"text": "Make a litre of stock and add it to the meat, veg and rice.", "tech": ["make-stock"]}, {"text": "Put back on the heat, bring to a simmer and cook slowly until all the stock is used up. Around 30 mins.", "tech": ["paella-rice"]}, {"text": "When the liquid has gone from the pan and you can hear the rice popping, take it off the heat and cover with foil.", "tech": ["socarrat"]}, {"text": "Leave for at least 10 mins, then serve.", "tech": ["rest-foil"]}], "tips": ["You can do it quicker on a higher heat, but OG's best ones are made with more stock and cooked for longer, up to an hour of adding stock."], "image": "images/arroz-con-chorizo.jpg", "imageAlt": "Paella-style rice with chicken thighs, sliced chorizo, red peppers and lemon wedges in a pan"}, {"id": "chilli", "name": "Chilli con frijoles y carne", "category": "Mince", "blurb": "Smoky beef and bean chilli with OG's secret weapon: a square of dark chocolate.", "prep": "15 mins", "cook": "30 mins", "serves": "4", "ingredients": ["500g beef mince", "400ml passata", "1 tbsp tomato purée", "4–5 cloves garlic", "1 onion", "Mushrooms", "Tin of kidney beans", "Tin of black-eyed beans", "3 tsp cumin", "1 tsp cayenne pepper or dried chilli", "Beef stock cube", "250g pancetta", "Mole, or a square of dark chocolate"], "steps": [{"text": "Chop the onion and garlic finely (grated garlic, granules or powder will do too).", "tech": ["chop-onion", "chop-garlic"]}, {"text": "Open and drain the kidney beans.", "tech": ["drain-tin"]}, {"text": "Make up the Oxo or beef stock.", "tech": ["make-stock"]}, {"text": "Put the pan on a low heat with a drizzle of oil. When the oil's hot, add the pancetta and stir gently until one side goes brown.", "tech": ["fry-pancetta"]}, {"text": "Add the onion and garlic and keep stirring gently until they go a bit see-through or slightly brown.", "tech": ["soften-onion"]}, {"text": "Add the mince, season it and brown it.", "tech": ["brown-mince"]}, {"text": "Once it's browned, take it off the heat and add the tomato purée, cumin and chilli, and crumble in the stock cube.", "tech": ["bloom-spices"]}, {"text": "Add 400ml of passata and the kidney beans, and season with salt and pepper.", "tech": ["season"]}, {"text": "Stir until it's all mixed in and put back on a medium heat. Add any black-eyed beans, chickpeas, mushrooms or veg you fancy.", "tech": ["simmer"]}, {"text": "Put the lid on and cook on a medium heat for 15 mins.", "tech": ["simmer"]}, {"text": "Take off the heat, stir the dark chocolate through, then taste.", "tech": ["chocolate-chilli"]}, {"text": "Add salt, pepper or chilli to taste if it needs it.", "tech": ["season"]}, {"text": "Put the lid back on and leave it to sit.", "tech": ["rest-sauce"]}], "tips": ["Great with Arroz de OG, tortillas and guacamole."], "image": "images/chilli.jpg", "imageAlt": "A steaming bowl of beef and kidney bean chilli topped with coriander"}, {"id": "bolognesa", "name": "Bolognesa di OG", "category": "Mince", "blurb": "The family bolognese, built on pancetta, a proper frito mix and a taste test.", "prep": "15 mins", "cook": "30 mins", "serves": "4", "ingredients": ["500g beef mince, or a mix of beef and lamb", "250ml passata", "1 tbsp tomato purée", "4–5 cloves garlic", "1 carrot", "1 onion", "1 stick of celery", "Basil", "Pinch of nutmeg", "Beef stock", "250g pancetta"], "steps": [{"text": "Dice the carrot, onion and celery finely into a frito mix.", "tech": ["fine-dice-frito"]}, {"text": "Chop the garlic finely.", "tech": ["chop-garlic"]}, {"text": "Make up the Oxo or beef stock.", "tech": ["make-stock"]}, {"text": "Put the pan on a low heat with a drizzle of oil. When the oil's hot, add the pancetta and stir a little until one side goes brown.", "tech": ["fry-pancetta"]}, {"text": "Add the frito mix and garlic and stir gently until it's soft and slightly brown.", "tech": ["cook-frito"]}, {"text": "Add the mince, season with salt and pepper, and brown it.", "tech": ["brown-mince"]}, {"text": "Once it's browned, take it off the heat and add the tomato purée, basil and nutmeg.", "tech": ["bloom-spices"]}, {"text": "Stir until it's all mixed in and put back on a medium heat.", "tech": ["simmer"]}, {"text": "Add the passata and season with salt and pepper.", "tech": ["season"]}, {"text": "Add the beef stock to the pan.", "tech": ["simmer"]}, {"text": "Put the lid on and cook on a medium heat for 15 mins.", "tech": ["simmer"]}, {"text": "Take off the heat and taste. Add salt, pepper or garlic if it needs it.", "tech": ["season"]}, {"text": "Put the lid back on and leave it to sit.", "tech": ["rest-sauce"]}], "tips": ["Serve with Pasta the OG way.", "The longer this sits, the better it tastes. Heat it back up when you're ready to start the pasta."], "image": "images/bolognesa.jpg", "imageAlt": "Spaghetti bolognese topped with grated parmesan and parsley"}, {"id": "lasagne", "name": "OG Lasagne", "category": "Mince", "blurb": "Bolognesa di OG and OG Béchamel, layered up with pasta sheets and baked until it bubbles.", "prep": "15 mins (plus the two sauces)", "cook": "35–40 mins", "serves": "4–6", "ingredients": ["1 batch Bolognesa di OG", "1 batch OG Béchamel", "9–12 dried lasagne sheets", "Grated mature cheddar for the top"], "equipment": ["Ovenproof dish, about 20 × 30cm"], "steps": [{"text": "Make a batch of Bolognesa di OG.", "tech": [], "see": "bolognesa"}, {"text": "Make a batch of OG Béchamel.", "tech": [], "see": "bechamel"}, {"text": "Heat the oven to 180°C fan.", "tech": []}, {"text": "Spread a thin layer of bolognese over the bottom of the dish.", "tech": ["layer-lasagne"]}, {"text": "Cover with a layer of lasagne sheets, snapping them to fit.", "tech": ["layer-lasagne"]}, {"text": "Add a layer of bolognese, then a layer of béchamel. Repeat sheets, bolognese and béchamel until the bolognese is used up, finishing with a layer of sheets.", "tech": ["layer-lasagne"]}, {"text": "Spread the rest of the béchamel over the top sheets and cover with grated cheese.", "tech": ["grate-cheese"]}, {"text": "Bake for 35–40 mins until it's bubbling and golden on top.", "tech": []}, {"text": "Leave it to stand for 10 mins before cutting, so it holds together.", "tech": []}], "tips": ["Make the bolognese the day before and it's even better."], "image": "images/lasagne.jpg", "imageAlt": "A baked lasagne with a golden cheese top in a tray, one portion cut out to show the layers"}, {"id": "pizza", "name": "OG Pizza", "category": "Weekend", "blurb": "No yeast, no waiting. Baking-powder dough means pizza on the table in about half an hour.", "prep": "15 mins", "cook": "12–15 mins", "serves": "2 bases", "ingredients": ["350g plain flour", "1 tsp salt", "1.5 tsp baking powder", "25ml olive oil", "200ml water", "Sauce: 50ml passata, salt, pepper, garlic granules or grated garlic", "Toppings: salami, chorizo, mushrooms", "Grated mature cheddar"], "steps": [{"text": "Heat the oven as hot as it goes (around 220°C fan) with a baking tray inside.", "tech": ["preheat-tray"]}, {"text": "Mix the flour, salt and baking powder in a bowl.", "tech": ["no-yeast-dough"]}, {"text": "Add the olive oil and water and mix into a soft dough.", "tech": ["no-yeast-dough"]}, {"text": "Knead on a floured worktop for 2–3 mins until it's smooth.", "tech": ["knead-dough"]}, {"text": "Split it in two and roll each half out thin.", "tech": ["roll-pizza"]}, {"text": "Mix the passata with salt, pepper and garlic.", "tech": ["pizza-sauce"]}, {"text": "Spread the sauce over the bases.", "tech": ["pizza-sauce"]}, {"text": "Add the salami, chorizo and mushrooms.", "tech": ["pizza-toppings"]}, {"text": "Cover with grated mature cheddar.", "tech": ["grate-cheese"]}, {"text": "Bake on the hot tray for 12–15 mins until the base is crisp and the cheese is bubbling.", "tech": ["bake-pizza"]}], "tips": [], "image": "images/pizza.jpg", "imageAlt": "Salami pizza with melted cheese and a sprig of basil, cut into slices"}, {"id": "roast-chicken", "name": "Roast Chicken Dinner", "category": "Weekend", "blurb": "The Sunday roast, OG's way.", "intro": "The trick to a roast dinner is understanding that roast meat keeps cooking after it comes out of the oven. Yorkshires can go in at any time, everything tastes better with garlic, parboiling the potatoes and parsnips cuts their cooking time right down, and Bisto gravy is perfect.", "prep": "20 mins", "cook": "1 hr 30 mins (depends on the bird)", "serves": "4", "ingredients": ["1 whole chicken", "Half a lemon", "Butter", "Potatoes", "Parsnips", "Oil", "Garlic cloves", "Yorkshire puddings", "Bisto gravy granules"], "steps": [{"text": "Push half a lemon upside down into the chicken's bum, and work some butter under the skin over the breast.", "tech": ["prep-roast-chicken"]}, {"text": "Roast in the centre of the oven until the juices run clear. Most chickens give a cooking time by weight, so use that. Cover with foil once it's brown enough, but leave it in until the time's up.", "tech": ["roast-chicken"]}, {"text": "Peel the potatoes and put them in a pan of cold water. Bring to the boil on a medium heat.", "tech": ["peel-potatoes"]}, {"text": "Cook for 15 mins.", "tech": ["parboil-potatoes"]}, {"text": "Peel the parsnips and cut them in half or quarters lengthways.", "tech": ["prep-parsnips"]}, {"text": "Boil them in a pan of water, or steam them over the spuds, for 6–8 mins.", "tech": ["parboil-potatoes"]}, {"text": "Drain the spuds and parsnips, and put the parsnips to one side.", "tech": ["parboil-potatoes"]}, {"text": "Put the lid on the potato pan and give the spuds a good bash about inside.", "tech": ["rough-up-potatoes"]}, {"text": "Put an oven tray in with a little oil. When it's hot, tip the spuds into the tray and put it at the bottom of the oven.", "tech": ["roast-potatoes"]}, {"text": "After 20 mins, add the parsnips and a few bashed garlic cloves to the tray, turn everything in the oil and put back in.", "tech": ["roast-parsnips"]}, {"text": "Check the chicken is cooked: the juices should run clear when you push a skewer into the thickest part of the thigh.", "tech": ["check-chicken"]}, {"text": "Take the chicken out, cover with foil and rest it for 15–20 mins. It'll carry on cooking.", "tech": ["rest-meat"]}, {"text": "While it rests, turn the oven up to about 220°C fan to crisp the spuds and parsnips, and put the Yorkshires in.", "tech": ["yorkshires"]}, {"text": "Make the Bisto gravy with boiling water, and stir in the juices from the chicken tray.", "tech": ["gravy"]}, {"text": "Carve the chicken and serve it all up.", "tech": ["carve-chicken"]}], "tips": ["Boil the potatoes and let them cool before roasting for super fluffy insides and crispy outsides."], "image": "images/roast-chicken.jpg", "imageAlt": "Roast chicken dinner with sliced chicken, roast potatoes, parsnips, a Yorkshire pudding, stuffing, broccoli and gravy"}]};

: {"id": "3Idqxn8VYFQ", "start": 0, "title": "How to make a roux", "channel": "atelierdeschefsuk", "short": false, "note": "Butter and flour roux as the base of a béchamel; UK channel"}, "bechamel-milk": {"id": "naONPKHbp50", "start": 157, "title": "This One Sauce Makes Better Lasagna, Mac and Cheese, Everything", "channel": "Let's Celebrate TV", "short": false, "note": "Starts at the chapter 'Add Milk and Simmer' (02:37) from the video's chapter list"}, "layer-lasagne": {"id": "YLxHoFOCOyc", "start": 0, "title": "How to layer lasagne", "channel": "Kidspot", "short": false, "note": "Layering meat sauce, white sauce and sheets"}, "boil-pasta": {"id": "UYhKDweME3A", "start": 0, "title": "How To Cook The Perfect Pasta", "channel": "Gordon Ramsay", "short": false, "note": "Gordon Ramsay's short guide to boiling pasta in salted water. He adds olive oil to the water, which OG's method doesn't."}};
const LABELS = {"absorption-rice": "cooking rice with the lid on", "bake-pizza": "baking the pizza", "bloom-spices": "adding spices off the heat", "boil-eggs": "boiling eggs", "brown-mince": "browning mince", "carve-chicken": "carving a chicken", "check-chicken": "checking the chicken's cooked", "chocolate-chilli": "chocolate in chilli", "chop-garlic": "chopping garlic", "chop-onion": "chopping an onion", "clean-mushrooms": "trimming mushrooms", "cook-prawns": "cooking prawns", "crack-eggs": "cracking eggs", "cream-curry": "adding cream to a curry", "cube-butter": "cubing butter", "dice-carrot": "dicing a carrot", "dice-chicken": "cutting chicken into chunks", "drain-tin": "draining tinned beans", "finger-rice-water": "the finger trick for rice water", "fried-rice": "making fried rice", "fry-chorizo": "frying chorizo", "fry-curry-paste": "frying Thai curry paste", "fry-egg": "frying an egg", "fry-pancetta": "frying pancetta", "garam-masala": "finishing with garam masala", "garlic-butter": "garlic butter", "garlic-mushrooms": "garlic mushrooms", "grate-cheese": "grating cheese", "grate-garlic": "grating garlic", "gravy": "making Bisto gravy", "knead-dough": "kneading dough", "make-stock": "making stock from a cube", "no-yeast-dough": "no-yeast pizza dough", "paella-rice": "cooking paella rice", "parboil-potatoes": "parboiling potatoes", "peel-potatoes": "peeling potatoes", "pizza-sauce": "pizza sauce", "pizza-toppings": "topping a pizza", "preheat-tray": "preheating a pizza tray", "prep-parsnips": "preparing parsnips", "prep-roast-chicken": "lemon and butter for roast chicken", "quarter-mushrooms": "quartering mushrooms", "reduce-sauce": "simmering a sauce thick", "rest-foil": "resting under foil", "rest-meat": "resting roast meat", "rest-rice": "resting rice", "rest-sauce": "letting a sauce sit", "rinse-rice": "rinsing rice", "roast-chicken": "roasting a chicken", "roast-parsnips": "roasting parsnips", "roast-potatoes": "roast potatoes in hot oil", "roll-pizza": "rolling a pizza base", "rough-up-potatoes": "bashing the spuds in the pan", "satay-paste": "making satay sauce", "scramble-eggs": "scrambling eggs", "seal-chicken": "frying chicken until white", "season": "seasoning to taste", "simmer": "simmering with the lid on", "slice-chicken": "slicing chicken thinly", "slice-mushrooms": "slicing mushrooms", "slice-pepper": "slicing peppers", "slice-spring-onion": "slicing spring onions", "socarrat": "the paella crust", "soften-onion": "softening onions", "stir-fry": "stir-frying", "thai-curry": "making a Thai curry", "whisk-eggs": "whisking eggs", "wok-toss": "tossing rice in a wok", "yorkshires": "Yorkshire puddings", "fine-dice-frito": "dicing a frito mix", "cook-frito": "cooking a frito mix", "make-roux": "making a roux", "bechamel-milk": "whisking in the milk", "layer-lasagne": "layering a lasagne", "boil-pasta": "cooking pasta"};
const REVIEW = false;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = BOOK.recipes;
const order = ['Basics','Breakfast','Sauces','Rice & Curries','Mince','Weekend'];
R.sort((a,b)=>order.indexOf(a.category)-order.indexOf(b.category));

function reviewBar(){
  if(!REVIEW) return '';
  const n = R.reduce((a,r)=>a+r.steps.filter(s=>s.check).length+Object.keys(r.ingredientChecks||{}).length,0);
  return `<div class="review"><div class="wrap"><p><strong>Draft for OG to check.</strong> ${n} bits I've filled in or changed are highlighted in yellow. Fix or approve them before this goes public.</p></div></div>`;
}

function cover(){
  document.title = 'The Neuro Spicy Cookbook';
  const groups = order.map(c=>[c,R.filter(r=>r.category===c)]).filter(g=>g[1].length);
  app.innerHTML = `${reviewBar()}<div class="tiles cover-tiles" aria-hidden="true"></div>
  <main class="wrap cover">
    <h1>The Neuro Spicy Cookbook</h1>
    <p class="lede">The family recipes, written the way OG actually cooks them. Tap any step number to watch how it's done.</p>
    ${BOOK.foreword?`<section class="foreword" aria-labelledby="fw"><h2 id="fw">${esc(BOOK.foreword.title)}</h2>${BOOK.foreword.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}<p class="sign">${esc(BOOK.foreword.sign)}</p></section>`:''}
    <nav class="contents" aria-label="Recipes">${groups.map(([c,rs])=>`
      <section><h2>${esc(c)}</h2><ul>${rs.map(r=>`<li><a href="#/${r.id}">${esc(r.name)}<small>${esc(r.blurb)}</small></a></li>`).join('')}</ul></section>`).join('')}
    </nav>
  </main>
  <div class="tiles strip" aria-hidden="true"></div>
  <footer class="wrap"><a href="the-neuro-spicy-cookbook.pdf">Download the printable book (PDF)</a>. Every step has a QR code that opens its video here. Videos belong to their creators and play from YouTube.</footer>`;
  window.scrollTo(0,0);
}

function recipe(id){
  const i = R.findIndex(r=>r.id===id); if(i<0) return cover();
  const r = R[i], prev = R[i-1], next = R[i+1];
  document.title = r.name + ' · The Neuro Spicy Cookbook';
  const ic = r.ingredientChecks || {};
  app.innerHTML = `${reviewBar()}<div class="tiles strip" aria-hidden="true"></div>
  <main class="wrap">
    <div class="top"><a href="#/">Contents</a><span>${i+1} of ${R.length}</span></div>
    <header class="rhead">
      <p class="cat">${esc(r.category)}</p>
      <h1>${esc(r.name)}</h1>
      ${r.aka?`<p class="aka">${esc(r.aka)}</p>`:''}
      <p class="blurb">${esc(r.blurb)}</p>
      <dl class="meta">${[['Prep',r.prep],['Cook',r.cook],['Serves',r.serves]].filter(x=>x[1]).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      ${r.intro?`<p class="intro">${esc(r.intro)}</p>`:''}
      ${r.image?`<img class="hero" src="${esc(r.image)}" alt="${esc(r.imageAlt||r.name)}" width="1400" height="933">`:''}
    </header>
    <div class="body">
      <section class="ingr" aria-labelledby="ih"><h2 id="ih">Ingredients</h2>
        <ul>${r.ingredients.map((g,k)=>`<li><label><input type="checkbox"><span>${esc(g)}${REVIEW&&ic[g]?`<span class="check" style="display:block">OG to check: ${esc(ic[g])}</span>`:''}</span></label></li>`).join('')}</ul>
        ${r.equipment?`<p class="equip">You'll need: ${esc(r.equipment.join(', '))}</p>`:''}
      </section>
      <section class="method" aria-labelledby="mh"><h2 id="mh">Method</h2>
        <ol class="steps">${r.steps.map((s,k)=>{
          const techs = s.tech.filter(t=>VIDEOS[t]&&VIDEOS[t].id);
          const first = techs[0];
          return `<li class="step" data-step="${k}">
            <button class="num" ${first?`data-tech="${first}" aria-expanded="false" aria-label="Step ${k+1}: watch ${esc(LABELS[first]||first)}"`:`disabled aria-label="Step ${k+1}"`}>${k+1}<span class="play"></span></button>
            <div class="stext"><p>${esc(s.text)}</p>
              ${s.see&&R.find(x=>x.id===s.see)?`<p class="see"><a href="#/${s.see}">Open the ${esc(R.find(x=>x.id===s.see).name)} recipe</a></p>`:''}
              ${techs.length?`<ul class="watch">${techs.map(t=>`<li><button data-tech="${t}" aria-pressed="false">Watch: ${esc(LABELS[t]||t)}</button></li>`).join('')}</ul>`:''}
              ${REVIEW&&s.check?`<p class="check">OG to check: ${esc(s.check)}</p>`:''}
            </div></li>`}).join('')}
        </ol>
        ${r.tips&&r.tips.length?`<aside class="tips"><h3>OG's tips</h3><ul>${r.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></aside>`:''}
      </section>
    </div>
    <nav class="flip" aria-label="Turn the page">
      ${prev?`<a href="#/${prev.id}"><small>Previous</small><strong>${esc(prev.name)}</strong></a>`:'<a href="#/"><small>Back to</small><strong>Contents</strong></a>'}
      ${next?`<a class="next" href="#/${next.id}"><small>Next</small><strong>${esc(next.name)}</strong></a>`:''}
    </nav>
  </main>
  <footer class="wrap">Videos belong to their creators and play from YouTube.</footer>`;
  window.scrollTo(0,0);
}

function closePlayer(li){
  li.querySelector('.player')?.remove();
  li.querySelectorAll('[data-tech]').forEach(b=>{ if(b.classList.contains('num')) b.setAttribute('aria-expanded','false'); else b.setAttribute('aria-pressed','false'); });
}
app.addEventListener('click', e=>{
  const b = e.target.closest('button[data-tech]'); if(!b) return;
  const li = b.closest('.step'), t = b.dataset.tech, v = VIDEOS[t];
  const open = li.querySelector('.player');
  const same = open && open.dataset.tech===t;
  document.querySelectorAll('.step').forEach(closePlayer);
  if(same) return;
  const fig = document.createElement('figure');
  fig.className = 'player' + (v.short?' short':''); fig.dataset.tech = t;
  const src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1${v.start?`&start=${v.start}`:''}`;
  fig.innerHTML = `<div class="frame"><iframe src="${src}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption>${esc(v.title)}, from ${esc(v.channel)} on YouTube. <a href="https://www.youtube.com/watch?v=${v.id}${v.start?`&t=${v.start}s`:''}" target="_blank" rel="noopener">Open on YouTube</a></figcaption>`;
  fig.style.margin = '.9rem 0 0';
  li.appendChild(fig);
  li.querySelectorAll(`[data-tech="${t}"]`).forEach(x=>{ if(x.classList.contains('num')) x.setAttribute('aria-expanded','true'); else x.setAttribute('aria-pressed','true'); });
  const n = li.querySelector('.num'); if(n.dataset.tech===t) n.setAttribute('aria-expanded','true');
});

document.addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea')) return;
  const a = document.querySelector(e.key==='ArrowRight'?'.flip .next':e.key==='ArrowLeft'?'.flip a:not(.next)':null);
  if(a) location.hash = a.getAttribute('href');
});
function route(){
  const [id, step] = location.hash.replace(/^#\/?/,'').split('/');
  if(!id) return cover();
  recipe(id);
  // QR codes in the printed book land on #/recipe/stepNumber: jump to that step and open its video
  const li = step && document.querySelector(`.step[data-step="${parseInt(step,10)-1}"]`);
  if(li){
    li.querySelector('.num:not([disabled])')?.click();
    // re-scroll once fonts and the player have settled, so the page doesn't drift past the step
    const go = () => li.scrollIntoView({block:'start'});
    go(); document.fonts && document.fonts.ready.then(go); setTimeout(go, 700); setTimeout(go, 1500);
  }
}
addEventListener('hashchange', route); route();
</script>
</body>
